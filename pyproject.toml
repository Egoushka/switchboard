[project]
name = "switchboard"
version = "0.1.0"
description = "One MCP front door to every homelab tool: search, describe, read, write (approved on a phone), more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mcp==2.2.0",
    "jmespath==1.1.0",
    "pyyaml==6.0.3",
    "prometheus-client==0.26.0",
]

[project.scripts]
switchboard = "switchboard.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
