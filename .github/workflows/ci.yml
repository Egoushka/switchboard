name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: docker build -t switchboard:dev .
      - run: docker compose -f tests/smoke/compose.yaml up -d
      - run: uv run python tests/smoke/check.py
      - if: failure()
        run: docker compose -f tests/smoke/compose.yaml logs
      - if: always()
        run: docker compose -f tests/smoke/compose.yaml down -v
  ci:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/egoushka/switchboard
          tags: type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags || 'ghcr.io/egoushka/switchboard:ci' }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: echo "pushed ${{ steps.meta.outputs.tags }}@${{ steps.build.outputs.digest }}"
