upstream: http://agentgateway:3000
ingress_token_env: SWITCHBOARD_TOKEN
approval: {telegram_token_env: SMOKE_TELEGRAM_TOKEN, approver_id_env: SMOKE_APPROVER_ID, timeout_s: 20}
scopes:
  homelab-ro: {upstream_route: /mcp/homelab, key_env: AGW_KEY_HOMELAB_SWITCHBOARD, writes: "off"}
  homelab-rw: {upstream_route: /mcp/homelab, key_env: AGW_KEY_HOMELAB_SWITCHBOARD, writes: approve}
servers:
  oura: {about: "Oura ring — sleep", trust_annotations: true}
